<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <nav class="navbar">
        <div class="container-navbar">
            <a href="index.html" class="logotipo">
                <img src="img/logoCenicaViva.png" alt="logotipo" style="height: 40px; width: auto;">
            </a>
            <ul class="menu-lista">
                <li class="menu-item"><a href="index.html" class="link-menu">Início</a></li>
                <li class="menu-item"><a href="login.html" class="link-menu">Login</a></li>
                <li class="menu-item"><a href="dashboard.html" class="link-menu">Dashboard</a></li>
            </ul>
        </div>
    </nav>
    <main class="container-main">
        <form>
            <h1>Cadastro</h1>
            <div class="input-box">
                <input placeholder="Nome" type="text">
            </div>
            <div class="input-box">
                <input placeholder="E-mail" type="email">
            </div>
            <div class="input-box">
                <input placeholder="Telefone" type="tel">
            </div>
            <div class="input-box">
                <input placeholder="Endereço" type="text">
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password">
            </div>
            <div  class="remember-forgot">
                <a href="#">Esqueci minha senha</a>
            </div>

            <button type="submit">Cadastro</button>

            <div class="register-link">
                <p>Já tem uma conta? <a href="#">Fazer login</a></p>
            </div>
        </form>
    </main>
</body>
</html>
